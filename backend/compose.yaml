services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goshop
      POSTGRES_USER: goshop
      POSTGRES_PASSWORD: goshop
    ports:
      - "5432:5432"
    volumes:
      - goshop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goshop -d goshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://goshop:goshop@postgres:5432/goshop?sslmode=disable
      JWT_SECRET: replace-with-at-least-32-random-characters
      HTTP_ADDR: ":8080"
      MIGRATIONS_DIR: /migrations
      ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19006
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  goshop_postgres:
